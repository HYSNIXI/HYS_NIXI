<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="description" content="Created By: HYS_Clock" />
  <meta name="theme-color" content="#667eea" />
  <title>HYS NIXI</title>

  <!-- 🛡️ Security: Prevent Right Click & DevTools -->
  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());

    document.onkeydown = function (e) {
      if (e.key === 'F12' || e.keyCode === 123) return false;
      if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) return false;
      if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) return false;
      if (e.metaKey && e.altKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c' || e.key === 'U' || e.key === 'u')) return false;
    };
  </script>

  <style>
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #333333;
      --muted: #888888;
      --shadow: rgba(0, 0, 0, 0.25);
      --border: rgba(102, 126, 234, 0.2);
      --clock-bg: rgba(102, 126, 234, 0.1);
      --clock-border: rgba(102, 126, 234, 0.25);
      --player-bg: rgba(102, 126, 234, 0.08);
    }

    body.dark {
      --card-bg: rgba(30, 30, 46, 0.95);
      --text: #eaeaea;
      --muted: #aaaaaa;
      --shadow: rgba(0, 0, 0, 0.6);
      --border: rgba(102, 126, 234, 0.4);
      --clock-bg: rgba(102, 126, 234, 0.18);
      --clock-border: rgba(102, 126, 234, 0.4);
      --player-bg: rgba(102, 126, 234, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
      overflow-y: scroll;
    }

    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
      background-size: 300% 300%;
      animation: gradientMove 15s ease infinite;
      transition: background 0.4s ease;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: none;
      touch-action: manipulation;
      transform: translateZ(0);
      overflow-anchor: none;
    }

    @keyframes gradientMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    body.perf-low {
      animation-duration: 40s;
    }

    body.perf-low .avatar {
      animation: none;
    }

    body.perf-low .card {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: var(--card-bg);
    }

    body.is-mobile .card {
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      background: var(--card-bg);
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      transform: translateZ(0);
    }

    @media (min-width: 501px) {
      body {
        padding-top: max(30px, calc((100vh - 760px) / 2));
      }
    }

    .card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 25px 22px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 15px 40px var(--shadow);
      border: 1px solid var(--border);
      transition: background 0.4s ease, transform 0.3s ease;
      animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      margin: 0 auto;
    }

    @keyframes cardIn {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .card:hover {
        transform: translateY(-8px);
      }
    }

    .theme-switch {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 3;
      --toggle-size: 13px;
      --container-width: 5.625em;
      --container-height: 2.5em;
      --container-radius: 6.25em;
      --container-light-bg: #3D7EAE;
      --container-night-bg: #1D1F2C;
      --circle-container-diameter: 3.375em;
      --sun-moon-diameter: 2.125em;
      --sun-bg: #ECCA2F;
      --moon-bg: #C4C9D1;
      --spot-color: #959DB1;
      --circle-container-offset: calc((var(--circle-container-diameter) - var(--container-height)) / 2 * -1);
      --stars-color: #fff;
      --clouds-color: #F3FDFF;
      --back-clouds-color: #AACADF;
      --transition: .4s cubic-bezier(0.4, 0.0, 0.2, 1);
      --circle-transition: .3s cubic-bezier(0.4, 0.0, 0.2, 1);
      display: block;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-switch,
    .theme-switch *,
    .theme-switch *::before,
    .theme-switch *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-size: var(--toggle-size);
    }

    .theme-switch__container {
      width: var(--container-width);
      height: var(--container-height);
      background-color: var(--container-light-bg);
      border-radius: var(--container-radius);
      overflow: hidden;
      cursor: pointer;
      box-shadow:
        0em -0.062em 0.062em rgba(0, 0, 0, 0.25),
        0em 0.062em 0.125em rgba(255, 255, 255, 0.94);
      transition: var(--transition);
      position: relative;
      transform: translateZ(0);
    }

    .theme-switch__container::before {
      content: "";
      position: absolute;
      z-index: 1;
      inset: 0;
      box-shadow:
        0em 0.05em 0.187em rgba(0, 0, 0, 0.25) inset,
        0em 0.05em 0.187em rgba(0, 0, 0, 0.25) inset;
      border-radius: var(--container-radius);
      pointer-events: none;
    }

    .theme-switch__checkbox {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    .theme-switch__checkbox:focus-visible+.theme-switch__container {
      outline: 2px solid rgba(255, 255, 255, 0.7);
      outline-offset: 3px;
    }

    .theme-switch__circle-container {
      width: var(--circle-container-diameter);
      height: var(--circle-container-diameter);
      background-color: rgba(255, 255, 255, 0.1);
      position: absolute;
      left: var(--circle-container-offset);
      top: var(--circle-container-offset);
      border-radius: var(--container-radius);
      box-shadow:
        inset 0 0 0 3.375em rgba(255, 255, 255, 0.1),
        inset 0 0 0 3.375em rgba(255, 255, 255, 0.1),
        0 0 0 0.625em rgba(255, 255, 255, 0.1),
        0 0 0 1.25em rgba(255, 255, 255, 0.1);
      display: flex;
      transition: var(--circle-transition);
      pointer-events: none;
      transform: translateZ(0);
    }

    .theme-switch__sun-moon-container {
      pointer-events: auto;
      position: relative;
      z-index: 2;
      width: var(--sun-moon-diameter);
      height: var(--sun-moon-diameter);
      margin: auto;
      border-radius: var(--container-radius);
      background-color: var(--sun-bg);
      box-shadow:
        0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset,
        0em -0.062em 0.062em 0em #a1872a inset;
      filter:
        drop-shadow(0.062em 0.125em 0.125em rgba(0, 0, 0, 0.25)) drop-shadow(0em 0.062em 0.125em rgba(0, 0, 0, 0.25));
      overflow: hidden;
      transition: var(--transition);
    }

    .theme-switch__moon {
      transform: translateX(100%);
      width: 100%;
      height: 100%;
      background-color: var(--moon-bg);
      border-radius: inherit;
      box-shadow:
        0.062em 0.062em 0.062em 0em rgba(254, 255, 239, 0.61) inset,
        0em -0.062em 0.062em 0em #969696 inset;
      transition: var(--transition);
      position: relative;
      transform: translateX(100%) translateZ(0);
    }

    .theme-switch__spot {
      position: absolute;
      top: 0.75em;
      left: 0.312em;
      width: 0.75em;
      height: 0.75em;
      border-radius: var(--container-radius);
      background-color: var(--spot-color);
      box-shadow: 0em 0.0312em 0.062em rgba(0, 0, 0, 0.25) inset;
    }

    .theme-switch__spot:nth-of-type(2) {
      width: 0.375em;
      height: 0.375em;
      top: 0.937em;
      left: 1.375em;
    }

    .theme-switch__spot:nth-last-of-type(3) {
      width: 0.25em;
      height: 0.25em;
      top: 0.312em;
      left: 0.812em;
    }

    .theme-switch__clouds {
      width: 1.25em;
      height: 1.25em;
      background-color: var(--clouds-color);
      border-radius: var(--container-radius);
      position: absolute;
      bottom: -0.625em;
      left: 0.312em;
      box-shadow:
        0.937em 0.312em var(--clouds-color),
        -0.312em -0.312em var(--back-clouds-color),
        1.437em 0.375em var(--clouds-color),
        0.5em -0.125em var(--back-clouds-color),
        2.187em 0 var(--clouds-color),
        1.25em -0.062em var(--back-clouds-color),
        2.937em 0.312em var(--clouds-color),
        2em -0.312em var(--back-clouds-color),
        3.625em -0.062em var(--clouds-color),
        2.625em 0em var(--back-clouds-color),
        4.5em -0.312em var(--clouds-color),
        3.375em -0.437em var(--back-clouds-color),
        4.625em -1.75em 0 0.437em var(--clouds-color),
        4em -0.625em var(--back-clouds-color),
        4.125em -2.125em 0 0.437em var(--back-clouds-color);
      transition: .4s cubic-bezier(0.4, 0.0, 0.2, 1);
    }

    .theme-switch__stars-container {
      position: absolute;
      color: var(--stars-color);
      top: -100%;
      left: 0.312em;
      width: 2.75em;
      height: auto;
      transition: var(--transition);
    }

    .theme-switch__checkbox:checked+.theme-switch__container {
      background-color: var(--container-night-bg);
    }

    .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__circle-container {
      left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter));
    }

    .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__moon {
      transform: translate(0) translateZ(0);
    }

    .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__clouds {
      bottom: -4.062em;
    }

    .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__stars-container {
      top: 50%;
      transform: translateY(-50%);
    }

    @media (hover: hover) and (pointer: fine) {
      .theme-switch__circle-container:hover {
        left: calc(var(--circle-container-offset) + 0.187em);
      }

      .theme-switch__checkbox:checked+.theme-switch__container .theme-switch__circle-container:hover {
        left: calc(100% - var(--circle-container-offset) - var(--circle-container-diameter) - 0.187em);
      }
    }

    .clock-box {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      background: var(--clock-bg);
      border: 1px solid var(--clock-border);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      animation: clockFadeIn 0.8s ease 0.3s both;
    }

    @keyframes clockFadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .clock-time {
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .clock-time .digit {
      display: inline-block;
      overflow: hidden;
      height: 1.1em;
      line-height: 1.1em;
      min-width: 0.62em;
      text-align: center;
      vertical-align: top;
    }

    .clock-time .digit>span {
      display: inline-block;
      will-change: transform, opacity;
    }

    .clock-time .digit>span.slide-down {
      animation: slideDown 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes slideDown {
      0% {
        transform: translateY(-100%);
        opacity: 0;
      }

      60% {
        opacity: 1;
      }

      100% {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .clock-time .sep {
      animation: blinkSep 1s infinite;
      color: var(--primary);
      font-weight: bold;
    }

    @keyframes blinkSep {

      0%,
      49% {
        opacity: 1;
      }

      50%,
      100% {
        opacity: 0.3;
      }
    }

    .clock-date {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      direction: ltr;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      margin: 22px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: float 3s ease-in-out infinite, pulse 4s ease-in-out infinite;
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      border-radius: 50%;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      transform: translateZ(0);
    }

    @keyframes float {

      0%,
      100% {
        transform: translate3d(0, 0, 0);
      }

      50% {
        transform: translate3d(0, -8px, 0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
      }

      50% {
        box-shadow: 0 8px 32px rgba(102, 126, 234, 0.9);
      }
    }

    .card h2 {
      color: var(--text);
      margin-bottom: 6px;
      font-size: 24px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark), var(--primary));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shine 3s linear infinite;
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    #typingText {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
      min-height: 20px;
      line-height: 1.5;
    }

    #typingText::after {
      content: "|";
      animation: blink 0.8s infinite;
      color: var(--primary);
      margin-right: 2px;
    }

    @keyframes blink {

      0%,
      50% {
        opacity: 1;
      }

      51%,
      100% {
        opacity: 0;
      }
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 15px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-radius: 25px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      opacity: 0;
      transform: translateY(15px);
      animation: btnIn 0.5s ease forwards;
      position: relative;
      overflow: hidden;
      will-change: transform, opacity;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      isolation: isolate;
      transform: translateZ(0);
    }

    .btn:nth-child(1) {
      animation-delay: 0.3s;
      --shine-delay: 0s;
    }

    .btn:nth-child(2) {
      animation-delay: 0.4s;
      --shine-delay: 0.9s;
    }

    .btn:nth-child(3) {
      animation-delay: 0.5s;
      --shine-delay: 1.8s;
    }

    .btn:nth-child(4) {
      animation-delay: 0.6s;
      --shine-delay: 2.7s;
    }

    .btn:nth-child(5) {
      animation-delay: 0.7s;
      --shine-delay: 3.6s;
    }

    .btn:nth-child(6) {
      animation-delay: 0.8s;
      --shine-delay: 4.5s;
    }

    .btn:nth-child(7) {
      animation-delay: 0.9s;
      --shine-delay: 5.4s;
    }

    .btn:nth-child(9) {
      animation-delay: 1.0s;
      --shine-delay: 6.3s;
    }

    .btn.entered,
    .music-player.entered {
      animation: none;
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes btnIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (hover: hover) and (pointer: fine) {
      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 22px rgba(102, 126, 234, 0.5);
      }

      .btn:hover .btn-icon {
        transform: scale(1.1) rotate(-10deg);
      }
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .btn:focus {
      outline: none;
    }

    .btn:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.6);
      outline-offset: 2px;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: linear-gradient(90deg,
          transparent 0%,
          rgba(102, 126, 234, 0.35) 30%,
          rgba(118, 75, 162, 0.55) 50%,
          rgba(102, 126, 234, 0.35) 70%,
          transparent 100%);
      pointer-events: none;
      animation: btnWave 9s ease-in-out infinite;
      animation-delay: var(--shine-delay, 0s);
      will-change: transform;
      z-index: 0;
    }

    @keyframes btnWave {
      0% {
        transform: translateX(0%);
      }

      50% {
        transform: translateX(-50%);
      }

      100% {
        transform: translateX(0%);
      }
    }

    .btn>* {
      position: relative;
      z-index: 1;
    }

    .btn .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.3s;
      overflow: hidden;
    }

    .btn .btn-icon svg {
      width: 13px;
      height: 13px;
      fill: currentColor;
    }

    .icon-aparat {
      background-color: #ED145B;
    }

    .icon-kick {
      background-color: #53FC18;
    }

    .icon-telegram {
      background-color: #0088cc;
    }

    .icon-instagram {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .icon-discord {
      background-color: #5865F2;
    }

    .icon-rubika {
      background-color: #714add;
    }

    .icon-donate {
      background-color: #ff4757;
    }

    .icon-remit {
      background-color: #00b894;
    }

    .icon-gif {
      background-color: #10ac84;
    }

    .icon-sibmo {
      background-color: #FFFFFF !important;
      border-radius: 6px !important;
      color: #6C5B7B !important;
      font-family: Arial, sans-serif !important;
      font-weight: 900 !important;
      font-size: 16px !important;
      line-height: 1 !important;
    }

    .icon-about {
      background-color: var(--primary);
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 15px 0;
      width: 100%;
      opacity: 0.6;
      border-radius: 2px;
    }

    #aboutSection,
    #donateSection {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .about-text {
      color: var(--text);
      font-size: 15px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 2.2;
      text-align: right;
      min-height: 150px;
      direction: rtl;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 0 5px;
      display: block;
      overflow-wrap: break-word;
      word-wrap: break-word;
      word-break: break-word;
    }

    .about-text p {
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .about-text p.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .back-btn {
      align-self: flex-start;

    .play-btn {
      position: relative;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 14px;
      cursor: pointer;

      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);

      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (hover: hover) and (pointer: fine) {
      .play-btn:hover {
        transform: scale(1.08);
      }
    }

    .play-btn:active {
      transform: scale(0.95);
    }

    .play-btn::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-right-color: var(--primary);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;

    .music-player.playing .play-btn::before {
      opacity: 1;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }

    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;

    .player-title {
      font-size: 11px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .player-title .note {
      display: inline-block;
      transition: transform 0.3s;
    }

    .music-player.playing .player-title .note {
      animation: bounce 0.6s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from {
        transform: translateY(0);
      }

      to {
        transform: translateY(-4px);
      }
    }

    #visualizer {
      display: block;
      width: 100%;
      height: 18px;
      margin: 0;
      pointer-events: none;
    }

    .progress-bar {
      width: 100%;
      height: 12px;
      background: transparent;
      border-radius: 10px;
      cursor: pointer;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      direction: ltr;
      display: flex;
      align-items: center;
    }

    .progress-bar .progress-track {
      width: 100%;
      height: 4px;
      background: rgba(102, 126, 234, 0.2);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 10px;
      transition: width 0.05s linear;
      will-change: width;
      pointer-events: none;

      display: flex;

    .volume-control {

    .volume-btn {
      background: transparent;

      color: var(--text);

      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    @media (hover: hover) and (pointer: fine) {

        transform: scale(1.15);

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 40px;
      height: 4px;
      background: rgba(102, 126, 234, 0.25);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      touch-action: manipulation;
      direction: ltr;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);
      transition: transform 0.2s;

        transform: scale(1.2);
      }

    .volume-slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);

    .hidden {

      height: 10px;
      z-index: 9998;
      pointer-events: none;
      border-radius: 2px;
      will-change: transform, opacity;

    #welcome-overlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
      background-size: 300% 300%;
      animation: gradientMove 8s ease infinite;
      color: #fff;
      font-family: Tahoma, sans-serif;
      opacity: 1;
      pointer-events: auto;
    }

    #welcome-overlay.hide {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }

    .welcome-glow {
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
      animation: welcomeGlow 2.4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes welcomeGlow {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.7;
      }

      50% {
        transform: scale(1.25);
        opacity: 1;
      }
    }

    .welcome-text {
      font-size: 44px;
      font-weight: 900;
      letter-spacing: 3px;
      text-align: center;
      line-height: 1.1;
      background: linear-gradient(90deg, #ffffff, #c7d2fe, #ffffff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: welcomeShine 2.5s linear infinite, welcomeEnter 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
      z-index: 2;
    }

    @keyframes welcomeShine {
      to {
        background-position: 200% center;
      }
    }

    @keyframes welcomeEnter {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.9);
        filter: blur(8px);
      }

      60% {
        opacity: 1;
        filter: blur(0);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .welcome-line {
      width: 0;
      height: 2px;
      margin: 18px 0 14px;
      background: linear-gradient(90deg, transparent, #ffffff, transparent);
      border-radius: 2px;
      animation: welcomeLine 1s ease 0.45s forwards;
      position: relative;
      z-index: 2;
    }

    @keyframes welcomeLine {
      to {
        width: 180px;
      }
    }

    .welcome-sub {
      font-size: 13px;
      letter-spacing: 6px;
      color: rgba(255, 255, 255, 0.85);
      text-transform: uppercase;
      opacity: 0;
      animation: welcomeSub 0.9s ease 0.85s forwards;
      position: relative;
      z-index: 2;
    }

    @keyframes welcomeSub {
      from {
        opacity: 0;
        transform: translateY(8px);
        letter-spacing: 3px;
      }

      to {
        opacity: 1;
        transform: translateY(0);
        letter-spacing: 6px;
      }
    }

    #birthday-overlay {

      inset: 0;
      z-index: 99998;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      color: #fff;
      font-family: Tahoma, sans-serif;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
      pointer-events: none;
      overflow: hidden;
    }

    #birthday-overlay.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    #birthday-overlay.hide {
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .bday-glow {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 107, 107, 0.3) 0%, rgba(255, 107, 107, 0) 70%);
      animation: bdayGlow 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes bdayGlow {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.6;
      }

      50% {
        transform: scale(1.3);
        opacity: 1;
      }

    .bday-text {
      font-size: 38px;
      font-weight: 900;
      text-align: center;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #ff6b6b);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: bdayShine 2s linear infinite, bdayEnter 1s cubic-bezier(0.22, 1, 0.36, 1) both;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 20px rgba(255, 107, 107, 0.5);
    }

    @keyframes bdayShine {
      to {
        background-position: 200% center;
      }
    }

    @keyframes bdayEnter {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.8);
      }

      60% {
        opacity: 1;
        transform: translateY(-5px) scale(1.05);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .bday-name {
      font-size: 60px;
      font-weight: 900;
      letter-spacing: 4px;
      margin: 15px 0 5px;
      background: linear-gradient(90deg, #fff, #c7d2fe, #fff);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: bdayShine 2.5s linear infinite;
      position: relative;
      z-index: 2;
    }

    .bday-age {
      font-size: 100px;
      font-weight: 900;
      color: #feca57;
      text-shadow: 0 0 30px rgba(254, 202, 87, 0.5);
      animation: bdayFloat 3s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    @keyframes bdayFloat {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-15px) scale(1.05);
      }
    }

    .bday-balloons {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 40px;
      height: 50px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: flyUp 6s ease-in infinite;
      opacity: 0;
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 1px;
      height: 15px;
      background: rgba(255, 255, 255, 0.5);
    }

    .balloon:nth-child(1) {
      left: 10%;
      background: #ff6b6b;
      animation-delay: 0s;
      animation-duration: 5s;
    }

    .balloon:nth-child(2) {
      left: 30%;
      background: #feca57;
      animation-delay: 1s;
      animation-duration: 7s;
    }

    .balloon:nth-child(3) {
      left: 50%;
      background: #48dbfb;
      animation-delay: 0.5s;
      animation-duration: 6s;
    }

    .balloon:nth-child(4) {
      left: 70%;
      background: #1dd1a1;
      animation-delay: 1.5s;
      animation-duration: 5.5s;
    }

    .balloon:nth-child(5) {
      left: 90%;
      background: #f368e0;
      animation-delay: 0.2s;
      animation-duration: 7.5s;
    }

    @keyframes flyUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-120vh) rotate(20deg);
        opacity: 0;
      }
    }

  <script>
    setTimeout(() => {
      document.querySelectorAll('.btn').forEach(btn => {
        btn.classList.add('entered');
      });
      const mp = document.getElementById('musicPlayer');
      if (mp) mp.classList.add('entered');
    }, 1800);

    (function initOverlays() {
      const welcomeOverlay = document.getElementById('welcome-overlay');
      const birthdayOverlay = document.getElementById('birthday-overlay');

      if (sessionStorage.getItem('welcomeShown')) {
        if (welcomeOverlay) welcomeOverlay.remove();
        if (birthdayOverlay) birthdayOverlay.remove();
        return;
      }
      sessionStorage.setItem('welcomeShown', '1');

      setTimeout(() => {
        welcomeOverlay.classList.add('hide');

        setTimeout(() => {
          welcomeOverlay.remove();

          birthdayOverlay.classList.add('show');

          setTimeout(() => {
            birthdayOverlay.classList.remove('show');
            birthdayOverlay.classList.add('hide');

            setTimeout(() => {
              birthdayOverlay.remove();
            }, 1000);

          }, 4500);
        }, 1000);
      }, 3800);
    })();

    const PM = (function initPerformanceManager() {
      const ua = navigator.userAgent;
      const isMobile = /Android|iPhone|iPad|iPod|Mobile|webOS|BlackBerry|Opera Mini/i.test(ua);
      const isTablet = /iPad|Tablet/i.test(ua) || (isMobile && window.innerWidth >= 600);
      const cores = navigator.hardwareConcurrency || 2;
      const memory = navigator.deviceMemory || 2;
      const pixelRatio = window.devicePixelRatio || 1;

      let score = 0;
      score += Math.min(cores, 8) * 12;
      score += Math.min(memory, 8) * 10;
      if (!isMobile && !isTablet) score += 50;
      if (pixelRatio > 2.5) score -= 10;

      let tier = 'high';
      if (score < 70) tier = 'low';
      else if (score < 130) tier = 'medium';

      const CONFIG = {
        high: { particles: isMobile ? 45 : 90, connections: isMobile ? false : true, confetti: isMobile ? 18 : 35, targetFPS: 60, pixelCap: 2, vizBars: isMobile ? 24 : 36 },
        medium: { particles: isMobile ? 25 : 50, connections: false, confetti: isMobile ? 12 : 20, targetFPS: 45, pixelCap: 1.5, vizBars: isMobile ? 18 : 28 },
        low: { particles: isMobile ? 15 : 25, connections: false, confetti: isMobile ? 8 : 12, targetFPS: 30, pixelCap: 1, vizBars: isMobile ? 12 : 18 }
      };
      const cfg = CONFIG[tier];

      document.body.classList.add('perf-' + tier);
      if (isMobile) document.body.classList.add('is-mobile');
      if (isTablet) document.body.classList.add('is-tablet');
      if (!isMobile && !isTablet) document.body.classList.add('is-desktop');

      let isBatterySaverMode = false;

      const state = {
        tier, isMobile, isTablet, cores, memory,
        particleCount: cfg.particles,
        connectionsEnabled: cfg.connections,
        confettiCount: cfg.confetti,
        targetFPS: cfg.targetFPS,
        pixelCap: cfg.pixelCap,
        vizBars: cfg.vizBars,
        degradationLevel: 0,
        maxDegradation: 2,
        startTime: Date.now(),
        errorCount: 0,
        warmupUntil: Date.now() + 8000,
        lastChangeAt: 0,
        changeCooldownMs: 15000,
        clock: {
          lastTick: Date.now(),
          syncStatus: 'initial',
          source: 'pending',
          consecutiveFailures: 0,
          totalTicks: 0,
          restartCount: 0,
          frozenDetected: false,
          isOnline: navigator.onLine
        }
      };

      try {
        if (navigator.getBattery) {
          navigator.getBattery().then(battery => {
            const checkBattery = () => {
              if (!battery.charging) {
                isBatterySaverMode = true;
              } else {
                isBatterySaverMode = false;
              }
            };
            checkBattery();
            battery.addEventListener('chargingchange', checkBattery);
          }).catch(() => { });
        }
      } catch (e) { }

      window.addEventListener('error', (e) => {
        state.errorCount++;
        console.warn('🛡️ PM Error:', e.message, '| at', e.filename + ':' + e.lineno);
      }, true);

      window.addEventListener('unhandledrejection', (e) => {
        state.errorCount++;
        console.warn('🛡️ PM Promise Rejection:', e.reason);
      });

      let frameCount = 0;
      let lastSampleTime = performance.now();
      let consecutiveLowFPS = 0;
      let consecutiveGoodFPS = 0;

      function fpsTick(now) {
        frameCount++;
        const elapsed = now - lastSampleTime;
        if (elapsed >= 1000) {
          const fps = Math.round(frameCount * 1000 / elapsed);
          frameCount = 0;
          lastSampleTime = now;

          if (Date.now() < state.warmupUntil) {
            consecutiveLowFPS = 0;
            consecutiveGoodFPS = 0;
            requestAnimationFrame(fpsTick);
            return;
          }

          if (Date.now() - state.lastChangeAt < state.changeCooldownMs) {
            consecutiveLowFPS = 0;
            consecutiveGoodFPS = 0;
            requestAnimationFrame(fpsTick);
            return;
          }

          const lowThreshold = state.targetFPS * 0.4;
          const goodThreshold = state.targetFPS * 0.8;

          if (fps < lowThreshold) {
            consecutiveLowFPS++;
            consecutiveGoodFPS = 0;
            if (consecutiveLowFPS >= 5 && state.degradationLevel < state.maxDegradation) {
              console.warn(`⚠️ PM: FPS=${fps} < ${lowThreshold.toFixed(0)} for 5s → degrading`);
              degrade();
              state.lastChangeAt = Date.now();
              consecutiveLowFPS = 0;
            }
          } else if (fps >= goodThreshold) {
            consecutiveGoodFPS++;
            consecutiveLowFPS = 0;
            if (consecutiveGoodFPS >= 20 && state.degradationLevel > 0) {
              console.log(`✅ PM: FPS=${fps} stable for 20s → recovering`);
              recover();
              state.lastChangeAt = Date.now();
              consecutiveGoodFPS = 0;
            }
          } else {
            consecutiveLowFPS = 0;
            consecutiveGoodFPS = 0;
          }
        }
        requestAnimationFrame(fpsTick);
      }
      requestAnimationFrame(fpsTick);

      function degrade() {
        state.degradationLevel++;
        if (state.degradationLevel === 1) {
          state.particleCount = Math.max(8, Math.floor(state.particleCount * 0.5));
          state.confettiCount = Math.max(5, Math.floor(state.confettiCount * 0.5));
          state.connectionsEnabled = false;
          state.vizBars = Math.max(8, Math.floor(state.vizBars * 0.6));
          if (window.__particles && Array.isArray(window.__particles)) {
            window.__particles.length = state.particleCount;
          }
          console.log('🛡️ PM: Degradation level 1 applied');
        } else if (state.degradationLevel === 2) {
          document.body.style.animation = 'none';
          document.body.classList.add('perf-low');
          state.particleCount = Math.max(5, Math.floor(state.particleCount * 0.5));
          state.confettiCount = Math.max(3, Math.floor(state.confettiCount * 0.5));
          state.vizBars = Math.max(6, Math.floor(state.vizBars * 0.6));
          if (window.__particles && Array.isArray(window.__particles)) {
            window.__particles.length = state.particleCount;
          }
          console.log('🛡️ PM: Degradation level 2 applied (final)');
        }
      }

      function recover() {
        if (state.degradationLevel <= 0) return;
        state.degradationLevel--;

        const fullCfg = CONFIG[state.tier] || CONFIG.high;

        if (state.degradationLevel === 0) {
          state.particleCount = fullCfg.particles;
          state.confettiCount = fullCfg.confetti;
          state.connectionsEnabled = fullCfg.connections;
          state.vizBars = fullCfg.vizBars;
          document.body.classList.remove('perf-low');
          document.body.style.animation = '';
          console.log('🛡️ PM: Recovered to level 0 (full performance)');
        } else if (state.degradationLevel === 1) {
          state.particleCount = Math.max(8, Math.floor(fullCfg.particles * 0.5));
          state.confettiCount = Math.max(5, Math.floor(fullCfg.confetti * 0.5));
          state.connectionsEnabled = false;
          state.vizBars = Math.max(8, Math.floor(fullCfg.vizBars * 0.6));
          document.body.classList.remove('perf-low');
          document.body.style.animation = '';
          console.log('🛡️ PM: Recovered to level 1');
        }

        window.dispatchEvent(new Event('pm:rebuild-particles'));
      }

      function markHeavyActivity(durationMs) {
        const d = durationMs || 1500;
        const until = Date.now() + d;
        if (until > state.warmupUntil) state.warmupUntil = until;
      }

      function clockTick() {
        state.clock.lastTick = Date.now();
        state.clock.totalTicks++;
      }

      function clockSyncSuccess(source) {
        state.clock.syncStatus = 'synced';
        state.clock.source = source;
        state.clock.consecutiveFailures = 0;
      }

      function clockSyncFailure() {
        state.clock.syncStatus = 'system';
        state.clock.source = 'system';
        state.clock.consecutiveFailures++;
      }

      function clockHealthCheck() {
        const now = Date.now();
        const sinceTick = now - state.clock.lastTick;

        if (sinceTick > 5000) {
          if (!state.clock.frozenDetected) {
            state.clock.frozenDetected = true;
            if (typeof window.__clockInterval !== 'undefined' && window.__clockInterval) {
              clearInterval(window.__clockInterval);
            }
            if (typeof updateClock === 'function') {
              window.__clockInterval = setInterval(updateClock, 1000);
              updateClock();
              state.clock.restartCount++;
              console.log(`✅ Clock restarted (total: ${state.clock.restartCount})`);
            }
          }
        } else {
          state.clock.frozenDetected = false;
        }

        if (state.clock.syncStatus === 'system' && state.clock.consecutiveFailures >= 2) {
          if (state.clock.isOnline && typeof syncTimeWithOnlineAPI === 'function') {
            if (now - (state.clock.lastSyncAttempt || 0) > 30000) {
              state.clock.lastSyncAttempt = now;
              console.log('🔄 Retrying time sync...');
              syncTimeWithOnlineAPI();
            }
          }
        }
      }

      setInterval(clockHealthCheck, 5000);

      window.addEventListener('online', () => {
        state.clock.isOnline = true;
        console.log('🌐 Network back online - re-syncing clock...');
        if (typeof syncTimeWithOnlineAPI === 'function') syncTimeWithOnlineAPI();
      });

      window.addEventListener('offline', () => {
        state.clock.isOnline = false;
        state.clock.syncStatus = 'system';
        state.clock.source = 'system';
        console.log('📴 Network offline - using system clock');
      });

      return {
        state,
        get: (key) => state[key],
        clockTick,
        clockSyncSuccess,
        clockSyncFailure,
        markHeavyActivity,
        resetDegradation: () => {
          state.degradationLevel = 0;
          state.warmupUntil = Date.now() + 5000;
          state.lastChangeAt = 0;
          recover();
          console.log('♻️ PM: Degradation manually reset');
        },
        getReport: () => ({

          batterySaver: isBatterySaverMode,
          degradation: state.degradationLevel,
          particles: state.particleCount,
          uptime: Math.round((Date.now() - state.startTime) / 1000),
          errors: state.errorCount,
          warmupRemainingMs: Math.max(0, state.warmupUntil - Date.now()),
          cooldownRemainingMs: Math.max(0, state.changeCooldownMs - (Date.now() - state.lastChangeAt)),
          clock: {
            status: state.clock.syncStatus,
            source: state.clock.source,
            lastTickAgo: Math.round((Date.now() - state.clock.lastTick) / 1000),
            ticks: state.clock.totalTicks,
            restarts: state.clock.restartCount,
            online: state.clock.isOnline
          }
        })
      };
    })();

    const colors = ["#667eea", "#764ba2", "#ff6b6b", "#feca57", "#48dbfb", "#1dd1a1"];

    function createConfetti(x, y) {
      const count = PM.state.confettiCount;
      for (let i = 0; i < count; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.left = x + "px";
        el.style.top = y + "px";
        el.style.transform = `translate3d(0,0,0) rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(el);

        const angle = Math.random() * Math.PI * 2;
        const velocity = 4 + Math.random() * 6;
        activeConfetti.push({
          el,
          posX: x,
          posY: y,
          velX: Math.cos(angle) * velocity,
          velY: Math.sin(angle) * velocity - 4,
          rotation: Math.random() * 360,
          life: 100
        });
      }

      PM.markHeavyActivity(1500);

      if (!confettiRAF) confettiRAF = requestAnimationFrame(confettiTick);
    }

    function confettiTick() {
      if (activeConfetti.length === 0) {
        confettiRAF = null;
        return;
      }

      for (let i = activeConfetti.length - 1; i >= 0; i--) {
        const c = activeConfetti[i];
        c.posX += c.velX;
        c.posY += c.velY;
        c.velY += 0.35;
        c.velX *= 0.99;
        c.rotation += 6;
        c.life--;

        c.el.style.left = c.posX + "px";
        c.el.style.top = c.posY + "px";
        c.el.style.transform = `rotate(${c.rotation}deg)`;
        c.el.style.opacity = c.life / 100;

        if (c.life <= 0 || c.posY > window.innerHeight) {
          c.el.remove();
          activeConfetti.splice(i, 1);
        }
      }
      confettiRAF = requestAnimationFrame(confettiTick);
    }

    const vizCanvas = document.getElementById("visualizer");
    const vizCtx = vizCanvas.getContext("2d");

    let audioCtx = null;
    let analyser = null;
    let sourceNode = null;
    let freqData = null;
    let prevFreqData = null;
    let vizActive = false;
    let vizRAF = null;
    let vizSetupDone = false;
    let vizAmplitude = 0;
    let vizTargetAmplitude = 0;
    let vizFrozenData = null;

    let barHeights = [];
    let fluxHistory = [];
    let fluxBaseline = 0;
    let bassPulse = 0;

    let bandStart = null;
    let bandEnd = null;

    function setupVisualizerCanvas() {
      const rect = vizCanvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, PM.state.pixelCap);
      vizCanvas.width = Math.max(1, Math.floor(rect.width * dpr));
      vizCanvas.height = Math.max(1, Math.floor(rect.height * dpr));
      vizCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      barHeights = new Array(PM.state.vizBars).fill(0);
      bandStart = null;
      bandEnd = null;
    }

    function buildLogBands(barCount, sampleRate, fftSize) {
      const binCount = fftSize / 2;
      const minF = 40;
      const maxF = Math.min(12000, sampleRate / 2 - 100);
      const logMin = Math.log10(minF);
      const logMax = Math.log10(maxF);

      const starts = new Array(barCount);
      const ends = new Array(barCount);

      for (let i = 0; i < barCount; i++) {
        const t1 = i / barCount;
        const t2 = (i + 1) / barCount;
        const f1 = Math.pow(10, logMin + (logMax - logMin) * t1);
        const f2 = Math.pow(10, logMin + (logMax - logMin) * t2);
        let b1 = Math.floor(f1 / (sampleRate / 2) * binCount);
        let b2 = Math.ceil(f2 / (sampleRate / 2) * binCount);
        b1 = Math.max(0, Math.min(binCount - 1, b1));
        b2 = Math.max(b1 + 1, Math.min(binCount, b2));
        starts[i] = b1;
        ends[i] = b2;
      }
      return { starts, ends };
    }

    function drawIdleLine() {
      if (!vizCtx) return;
      const rect = vizCanvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      vizCtx.clearRect(0, 0, w, h);

      const y = h - 1.5;
      vizCtx.strokeStyle = "rgba(102, 126, 234, 0.25)";
      vizCtx.lineWidth = 1;
      vizCtx.beginPath();
      vizCtx.moveTo(0, y + 0.5);
      vizCtx.lineTo(w, y + 0.5);
      vizCtx.stroke();
    }

    function setupAudioAnalyser() {
      if (vizSetupDone) return;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) throw new Error("Web Audio API not supported");
        audioCtx = new AC();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.35;
        analyser.minDecibels = -95;
        analyser.maxDecibels = -15;

        sourceNode = audioCtx.createMediaElementSource(audio);
        sourceNode.connect(analyser);
        analyser.connect(audioCtx.destination);

        const binCount = analyser.frequencyBinCount;
        freqData = new Uint8Array(binCount);
        prevFreqData = new Uint8Array(binCount);
        vizFrozenData = new Uint8Array(binCount);

        const bands = buildLogBands(PM.state.vizBars, audioCtx.sampleRate, analyser.fftSize);
        bandStart = bands.starts;
        bandEnd = bands.ends;

        vizSetupDone = true;
      } catch (err) {
        console.warn("Visualizer unavailable:", err.message);
        vizSetupDone = true;
        analyser = null;
      }
    }

    function drawVisualizer(now) {
      if (!vizActive && vizAmplitude < 0.005) {
        vizAmplitude = 0;
        vizTargetAmplitude = 0;
        vizRAF = null;
        drawIdleLine();
        return;
      }

      vizRAF = requestAnimationFrame(drawVisualizer);

      const ampDiff = vizTargetAmplitude - vizAmplitude;
      if (Math.abs(ampDiff) < 0.002) vizAmplitude = vizTargetAmplitude;
      else vizAmplitude += ampDiff * 0.13;

      if (!analyser || !freqData) {
        drawSimulatedBars();
        return;
      }

      if (vizActive) {
        prevFreqData.set(freqData);
        analyser.getByteFrequencyData(freqData);
        vizFrozenData.set(freqData);
      } else {
        freqData.fill(0);
      }

      const rect = vizCanvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      vizCtx.clearRect(0, 0, w, h);

      const barCount = PM.state.vizBars;

      if (!bandStart || bandStart.length !== barCount) {
        const bands = buildLogBands(barCount, audioCtx.sampleRate, analyser.fftSize);
        bandStart = bands.starts;
        bandEnd = bands.ends;
        barHeights = new Array(barCount).fill(0);
      }

      const barSlot = w / barCount;
      const barWidth = Math.max(1.5, barSlot - 1.6);
      const radius = Math.min(barWidth / 2, 1.5);
      const baseline = h - 1.5;

      let flux = 0;
      if (vizActive) {
        for (let i = 0; i < freqData.length; i++) {
          const d = freqData[i] - prevFreqData[i];
          if (d > 0) flux += d;
        }
        flux /= freqData.length;

        fluxHistory.push(flux);
        if (fluxHistory.length > 43) fluxHistory.shift();
        fluxBaseline = fluxHistory.reduce((a, b) => a + b, 0) / fluxHistory.length;

        const threshold = fluxBaseline * 1.35 + 0.5;
        if (flux > threshold) {
          bassPulse = Math.min(1, bassPulse + 0.6);
        }
      }
      bassPulse *= 0.78;

      const gradient = vizCtx.createLinearGradient(0, h, 0, 0);
      gradient.addColorStop(0, "#667eea");
      gradient.addColorStop(1, "#764ba2");

      for (let i = 0; i < barCount; i++) {
        let sum = 0;
        const s = bandStart[i];
        const e = bandEnd[i];
        const n = e - s;
        for (let j = s; j < e; j++) sum += freqData[j];
        const avg = n > 0 ? sum / n : 0;

        let target = Math.pow(avg / 255, 0.68);

        const tilt = 1 + (1 - i / barCount) * 0.35;
        target = Math.min(1, target * tilt);

        target = Math.min(1, target + bassPulse * 0.25 * (1 - i / barCount * 0.5));

        const cur = barHeights[i];
        if (target > cur) {
          barHeights[i] = cur + (target - cur) * 0.95;
        } else {
          barHeights[i] = cur + (target - cur) * 0.16;
        }

        const barH = Math.max(0.5, barHeights[i] * (h - 2) * vizAmplitude);
        const x = i * barSlot + (barSlot - barWidth) / 2;
        const y = baseline - barH;

        vizCtx.fillStyle = gradient;
        vizCtx.beginPath();
        vizCtx.moveTo(x, baseline);
        vizCtx.lineTo(x, y + radius);
        vizCtx.quadraticCurveTo(x, y, x + radius, y);
        vizCtx.lineTo(x + barWidth - radius, y);
        vizCtx.quadraticCurveTo(x + barWidth, y, x + barWidth, y + radius);
        vizCtx.lineTo(x + barWidth, baseline);
        vizCtx.closePath();
        vizCtx.fill();
      }
    }

    let simTick = 0;
    function drawSimulatedBars() {
      const rect = vizCanvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;
      vizCtx.clearRect(0, 0, w, h);

      const barCount = PM.state.vizBars;
      const barSlot = w / barCount;
      const barWidth = Math.max(1.5, barSlot - 1.6);
      const radius = Math.min(barWidth / 2, 1.5);

      const gradient = vizCtx.createLinearGradient(0, h, 0, 0);
      gradient.addColorStop(0, "#667eea");
      gradient.addColorStop(1, "#764ba2");

      const baseline = h - 1.5;
      simTick += 0.15;

      for (let i = 0; i < barCount; i++) {
        const v = (Math.sin(simTick + i * 0.5) + 1) / 2;
        const barH = Math.max(0.5, v * (h - 2) * 0.85 * vizAmplitude);
        const x = i * barSlot + (barSlot - barWidth) / 2;
        const y = baseline - barH;

        vizCtx.fillStyle = gradient;
        vizCtx.beginPath();
        vizCtx.moveTo(x, baseline);
        vizCtx.lineTo(x, y + radius);
        vizCtx.quadraticCurveTo(x, y, x + radius, y);
        vizCtx.lineTo(x + barWidth - radius, y);
        vizCtx.quadraticCurveTo(x + barWidth, y, x + barWidth, y + radius);
        vizCtx.lineTo(x + barWidth, baseline);
        vizCtx.closePath();
        vizCtx.fill();
      }
    }

    function startVisualizer() {
      setupAudioAnalyser();
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => { });
      }
      vizActive = true;
      vizTargetAmplitude = 1;
      if (!vizRAF) drawVisualizer();
    }

    function stopVisualizer() {
      vizActive = false;
      vizTargetAmplitude = 0;
      if (!vizRAF) drawVisualizer();
    }

    function initVisualizer() {
      setupVisualizerCanvas();
      drawIdleLine();
    }
    initVisualizer();
    window.addEventListener("resize", () => {
      setupVisualizerCanvas();
      if (!vizActive && vizAmplitude < 0.005) drawIdleLine();
    }, { passive: true });

    audio.addEventListener("play", startVisualizer);
    audio.addEventListener("pause", stopVisualizer);
    audio.addEventListener("ended", stopVisualizer);

    const aboutBtn = document.getElementById("aboutBtn");
    const aboutSection = document.getElementById("aboutSection");
    const aboutText = document.getElementById("aboutText");
    const backBtn = document.getElementById("backBtn");

    const donateBtn = document.getElementById("donateBtn");
    const donateSection = document.getElementById("donateSection");
    const backFromDonateBtn = document.getElementById("backFromDonateBtn");

    const mainButtons = document.getElementById("mainButtons");
    const mainCard = document.getElementById("mainCard");

    const aboutContent = `سلام! من نیکسیم، اسم واقعیم هانیه‌ست و 24+2 سالمه.

    const SMOOTH_EASE = 'cubic-bezier(0.22, 1, 0.36, 1)';

    // 🚀 FIX: Detect mobile viewport for smoother transitions
    const isMobileView = () => window.innerWidth <= 500;

    const RETURN_ANIMATIONS = [
      { name: 'Slide Up', kf: [{ opacity: 0, transform: 'translateY(30px)' }, { opacity: 1, transform: 'translateY(0)' }] },
      { name: 'Slide Down', kf: [{ opacity: 0, transform: 'translateY(-30px)' }, { opacity: 1, transform: 'translateY(0)' }] },
      { name: 'Slide Left', kf: [{ opacity: 0, transform: 'translateX(-40px)' }, { opacity: 1, transform: 'translateX(0)' }] },
      { name: 'Slide Right', kf: [{ opacity: 0, transform: 'translateX(40px)' }, { opacity: 1, transform: 'translateX(0)' }] },
      { name: 'Zoom In', kf: [{ opacity: 0, transform: 'scale(0.75)' }, { opacity: 1, transform: 'scale(1)' }] },
      { name: 'Flip X', kf: [{ opacity: 0, transform: 'perspective(800px) rotateX(-60deg)' }, { opacity: 1, transform: 'perspective(800px) rotateX(0)' }] },
      { name: 'Bounce In', kf: [{ opacity: 0, transform: 'translateY(35px) scale(0.92)' }, { opacity: 1, transform: 'translateY(-4px) scale(1.02)', offset: 0.6 }, { opacity: 1, transform: 'translateY(0) scale(1)' }] },
      { name: 'Rotate In', kf: [{ opacity: 0, transform: 'rotate(-8deg) scale(0.88)' }, { opacity: 1, transform: 'rotate(0deg) scale(1)' }] },
      { name: 'Fade In', kf: [{ opacity: 0 }, { opacity: 1 }] }
    ];

    // 🚀 FIX: On mobile, skip the height animation to prevent scroll jump.
    // Fade + instant height swap feels smoother and eliminates scroll-clamp jank.
    function animateCardHeight(fromH, toH, duration) {
      if (isMobileView()) {
        // Instant height change on mobile — no scroll clamp animation
        return Promise.resolve();
      }

      duration = duration || 400;
      return new Promise((resolve) => {
        mainCard.style.overflow = 'hidden';
        mainCard.style.willChange = 'height';

        const anim = mainCard.animate(
          [{ height: fromH + 'px' }, { height: toH + 'px' }],
          { duration: duration, easing: SMOOTH_EASE, fill: 'both' }
        );

        anim.onfinish = () => {
          anim.cancel();
          mainCard.style.height = '';
          mainCard.style.overflow = '';
          mainCard.style.willChange = 'auto';
          resolve();
        };
      });
    }

    let aboutRevealTimeouts = [];
    function clearAboutRevealTimeouts() {
      aboutRevealTimeouts.forEach((t) => clearTimeout(t));
      aboutRevealTimeouts = [];
    }

    let isTransitioning = false;

    // 🚀 FIX: Handle scroll before shrinking to prevent the page-jump on mobile.
    // If the user scrolled down to reach the button, we smoothly scroll back to
    // top during the fadeout, then force scroll to top before the card shrinks.
    async function prepareForShrink() {
      const wasScrolled = window.scrollY > 5;
      if (wasScrolled) {
        try {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      }
      return wasScrolled;
    }

    function finishScrollReset(wasScrolled) {
      // Ensure we're at top BEFORE the card shrinks
      if (wasScrolled && window.scrollY > 0) {
        try {
          window.scrollTo({ top: 0, behavior: 'instant' });
        } catch (e) {
          window.scrollTo(0, 0);
        }
      }
    }

    async function goToAbout() {
      if (isTransitioning) return;
      isTransitioning = true;

      try {
        PM.markHeavyActivity(1500);
        clearAboutRevealTimeouts();

        // 🚀 FIX: handle scroll jump
        const wasScrolled = await prepareForShrink();
        const fadeMs = wasScrolled ? 380 : 220;

        const oldHeight = mainCard.offsetHeight;

        const out1 = mainButtons.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: fadeMs, easing: 'ease-out', fill: 'forwards' }
        );
        const out2 = musicPlayer.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: fadeMs, easing: 'ease-out', fill: 'forwards' }
        );
        await Promise.all([out1.finished, out2.finished]);

        // Guarantee we're at top before shrink
        finishScrollReset(wasScrolled);

        out1.cancel();
        out2.cancel();

        aboutText.innerHTML = "";
        const lines = aboutContent.split("\n").filter((line) => line.trim() !== "");
        const paragraphs = [];
        lines.forEach((line) => {
          const p = document.createElement("p");
          p.textContent = line.trim();
          aboutText.appendChild(p);
          paragraphs.push(p);
        });

        mainButtons.classList.add('hidden');
        musicPlayer.classList.add('hidden');
        aboutSection.classList.remove('hidden');

        aboutSection.style.opacity = '0';
        aboutSection.style.transform = 'translateY(-8px)';

        const newHeight = mainCard.offsetHeight;
        await animateCardHeight(oldHeight, newHeight);

        aboutSection.style.opacity = '';
        aboutSection.style.transform = '';

        const sectionIn = aboutSection.animate(
          [
            { opacity: 0, transform: 'translateY(-8px)' },
            { opacity: 1, transform: 'translateY(0)' }
          ],
          { duration: 380, easing: SMOOTH_EASE, fill: 'both' }
        );

        paragraphs.forEach((p, index) => {
          const t = setTimeout(() => {
            p.classList.add('revealed');
          }, 120 + index * 220);
          aboutRevealTimeouts.push(t);
        });

        await sectionIn.finished;
        sectionIn.cancel();
      } finally {
        isTransitioning = false;
      }
    }

    async function goToDonate() {
      if (isTransitioning) return;
      isTransitioning = true;

      try {
        PM.markHeavyActivity(1500);
        clearAboutRevealTimeouts();

        // 🚀 FIX: handle scroll jump (this was the "refresh" feeling)
        const wasScrolled = await prepareForShrink();
        const fadeMs = wasScrolled ? 380 : 220;

        const oldHeight = mainCard.offsetHeight;

        const out1 = mainButtons.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: fadeMs, easing: 'ease-out', fill: 'forwards' }
        );
        const out2 = musicPlayer.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: fadeMs, easing: 'ease-out', fill: 'forwards' }
        );
        await Promise.all([out1.finished, out2.finished]);

        // Guarantee we're at top before shrink
        finishScrollReset(wasScrolled);

        out1.cancel();
        out2.cancel();

        mainButtons.classList.add('hidden');
        musicPlayer.classList.add('hidden');

        donateSection.querySelectorAll('.btn').forEach(btn => {
          btn.classList.remove('entered');
        });

        donateSection.classList.remove('hidden');

        donateSection.style.opacity = '0';
        donateSection.style.transform = 'translateY(-8px)';

        const newHeight = mainCard.offsetHeight;
        await animateCardHeight(oldHeight, newHeight);

        donateSection.style.opacity = '';
        donateSection.style.transform = '';

        const sectionIn = donateSection.animate(
          [
            { opacity: 0, transform: 'translateY(-8px)' },
            { opacity: 1, transform: 'translateY(0)' }
          ],
          { duration: 380, easing: SMOOTH_EASE, fill: 'both' }
        );

        await sectionIn.finished;
        sectionIn.cancel();
      } finally {
        isTransitioning = false;
      }
    }

    async function goToMain(fromSection = 'about') {
      if (isTransitioning) return;
      isTransitioning = true;

      try {
        PM.markHeavyActivity(1500);
        clearAboutRevealTimeouts();
        const oldHeight = mainCard.offsetHeight;

        const activeSection = fromSection === 'donate' ? donateSection : aboutSection;

        const outAnim = activeSection.animate(
          [{ opacity: 1 }, { opacity: 0 }],
          { duration: 180, easing: 'ease-out', fill: 'forwards' }
        );
        await outAnim.finished;
        outAnim.cancel();

        if (fromSection === 'about') {
          aboutText.innerHTML = "";
          aboutSection.classList.add('hidden');
          aboutSection.style.opacity = '';
          aboutSection.style.transform = '';
        } else {
          donateSection.classList.add('hidden');
          donateSection.style.opacity = '';
          donateSection.style.transform = '';
        }

        mainButtons.classList.remove('hidden');
        musicPlayer.classList.remove('hidden');

        const items = [...mainButtons.children];

        musicPlayer.style.opacity = '0';
        items.forEach(el => { el.style.opacity = '0'; });

        const newHeight = mainCard.offsetHeight;
        await animateCardHeight(oldHeight, newHeight);

        const pick = RETURN_ANIMATIONS[Math.floor(Math.random() * RETURN_ANIMATIONS.length)];

        musicPlayer.style.opacity = '';
        items.forEach(el => { el.style.opacity = ''; });

        const mpAnim = musicPlayer.animate(pick.kf, {
          duration: 480, easing: SMOOTH_EASE, fill: 'both'
        });
        const itemAnims = items.map((el, i) =>
          el.animate(pick.kf, {
            duration: 480,
            delay: 60 + i * 30,
            easing: SMOOTH_EASE,
            fill: 'both'
          })
        );

        const allAnims = [mpAnim, ...itemAnims];
        Promise.all(allAnims.map(a => a.finished))
          .then(() => { allAnims.forEach(a => a.cancel()); })
          .catch(() => { });
      } finally {
        isTransitioning = false;
      }
    }

    aboutBtn.addEventListener("click", (e) => { e.preventDefault(); goToAbout(); });
    backBtn.addEventListener("click", () => { goToMain('about'); });

    donateBtn.addEventListener("click", (e) => { e.preventDefault(); goToDonate(); });
    backFromDonateBtn.addEventListener("click", () => { goToMain('donate'); });

    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d", { alpha: true });
    let particles = [];
    window.__particles = particles;
    const mouse = { x: null, y: null, radius: 120 };

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, PM.state.pixelCap);
      canvas.width = window.innerWidth * ratio;
      canvas.height = window.innerHeight * ratio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    resize();
    window.addEventListener("resize", resize, { passive: true });

    window.addEventListener("mousemove", (e) => { mouse.x = e.x; mouse.y = e.y; }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });
    window.addEventListener("mouseout", () => { mouse.x = null; mouse.y = null; });

    class Particle {
      constructor() {
        this.x = Math.random() * window.innerWidth;
        this.y = Math.random() * window.innerHeight;
        this.size = Math.random() * 2.5 + 1;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.speedY = (Math.random() - 0.5) * 0.6;
        this.opacity = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > window.innerWidth) this.speedX *= -1;
        if (this.y < 0 || this.y > window.innerHeight) this.speedY *= -1;
        if (mouse.x != null && mouse.y != null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < mouse.radius && dist > 0) {
            const force = (mouse.radius - dist) / mouse.radius;
            this.x -= (dx / dist) * force * 2;
            this.y -= (dy / dist) * force * 2;
          }
        }
      }
      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles.length = 0;
      const count = PM.state.particleCount;
      for (let i = 0; i < count; i++) particles.push(new Particle());
    }
    initParticles();

    window.addEventListener('pm:rebuild-particles', () => {
      initParticles();
    });

    window.addEventListener("resize", initParticles, { passive: true });

    function connectParticles() {
      if (!PM.state.connectionsEnabled) return;
      const maxDist = 120;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < maxDist) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * (1 - dist / maxDist)})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    const frameInterval = 1000 / PM.state.targetFPS;
    let lastFrameTime = 0;

    function animate(timestamp) {
      requestAnimationFrame(animate);

      if (!timestamp) timestamp = performance.now();
      if (timestamp - lastFrameTime < frameInterval - 1) return;
      lastFrameTime = timestamp;

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach((p) => { p.update(); p.draw(); });
      connectParticles();
    }
    requestAnimationFrame(animate);

    setInterval(() => {
      const r = PM.getReport();
      const c = r.clock;
      console.log(`Health | Tier: ${r.tier} | BatterySaver: ${r.batterySaver} | Particles: ${r.particles} | Degradation: ${r.degradation}/2 | Errors: ${r.errors} | Uptime: ${r.uptime}s | Warmup: ${r.warmupRemainingMs}ms | Cooldown: ${r.cooldownRemainingMs}ms`);
    }, 60000);

    console.log("HYS NIXI loaded successfully — type PMReport() or PMReset() in console for debugging");
  </script>
