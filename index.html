<!doctype html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="description" content="HYS NIXI - لینک‌های ارتباطی" />
  <meta name="theme-color" content="#667eea" />
  <title>HYS NIXI</title>

  <style>
    /* ===== متغیرهای CSS ===== */
    :root {
      --primary: #667eea;
      --primary-dark: #764ba2;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #333333;
      --muted: #888888;
      --shadow: rgba(0, 0, 0, 0.25);
      --border: rgba(102, 126, 234, 0.2);
      --clock-bg: rgba(102, 126, 234, 0.1);
      --clock-border: rgba(102, 126, 234, 0.25);
      --player-bg: rgba(102, 126, 234, 0.08);
    }

    body.dark {
      --card-bg: rgba(30, 30, 46, 0.95);
      --text: #eaeaea;
      --muted: #aaaaaa;
      --shadow: rgba(0, 0, 0, 0.6);
      --border: rgba(102, 126, 234, 0.4);
      --clock-bg: rgba(102, 126, 234, 0.18);
      --clock-border: rgba(102, 126, 234, 0.4);
      --player-bg: rgba(102, 126, 234, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ===== بهینه‌سازی پایه برای موبایل ===== */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    /* ===== پس‌زمینه گرادیانتی متحرک ===== */
    body {
      font-family: Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2, #667eea);
      background-size: 300% 300%;
      animation: gradientMove 15s ease infinite;
      transition: background 0.4s ease;
      overflow-x: hidden;
      position: relative;

      /* 👇 بهینه‌سازی موبایل */
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior-y: none;
      touch-action: manipulation;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ===== کانواس ذرات ===== */
    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      transform: translateZ(0);
    }

    /* ===== کارت ===== */
    .card {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      padding: 30px 25px 25px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 15px 40px var(--shadow);
      border: 1px solid var(--border);
      transition: transform 0.3s ease, background 0.4s ease;
      animation: cardIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    @keyframes cardIn {
      0% { opacity: 0; transform: translateY(40px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (hover: hover) and (pointer: fine) {
      .card:hover { transform: translateY(-8px); }
    }

    /* ===== دکمه تم ===== */
    .theme-btn {
      position: absolute;
      top: 15px;
      left: 15px;
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: var(--clock-bg);
      color: var(--text);
      font-size: 17px;
      cursor: pointer;
      transition: transform 0.3s, background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .theme-btn:hover {
      transform: rotate(25deg) scale(1.1);
      background: rgba(102, 126, 234, 0.3);
    }

    /* ===== ساعت و تاریخ ===== */
    .clock-box {
      position: absolute;
      top: 15px;
      right: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      background: var(--clock-bg);
      border: 1px solid var(--clock-border);
      border-radius: 14px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: none;
      animation: clockFadeIn 0.8s ease 0.3s both;
    }

    @keyframes clockFadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .clock-time {
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: bold;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      direction: ltr;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .clock-time .sep {
      animation: blinkSep 1s infinite;
      color: var(--primary);
      font-weight: bold;
    }

    @keyframes blinkSep {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0.3; }
    }

    .clock-date {
      font-family: Arial, sans-serif;
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      direction: ltr;
    }

    /* ===== آواتار ===== */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      margin: 25px auto 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      animation: float 3s ease-in-out infinite, pulse 4s ease-in-out infinite;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4); }
      50% { box-shadow: 0 8px 32px rgba(102, 126, 234, 0.9); }
    }

    /* ===== متن‌ها ===== */
    .card h2 {
      color: var(--text);
      margin-bottom: 8px;
      font-size: 26px;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark), var(--primary));
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shine 3s linear infinite;
    }

    @keyframes shine {
      to { background-position: 200% center; }
    }

    #typingText {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 22px;
      min-height: 22px;
      line-height: 1.6;
    }

    #typingText::after {
      content: "|";
      animation: blink 0.8s infinite;
      color: var(--primary);
      margin-right: 2px;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      51%, 100% { opacity: 0; }
    }

    /* ===== دکمه‌ها ===== */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      transition: opacity 0.3s ease;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      border-radius: 25px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      opacity: 0;
      transform: translateY(15px);
      animation: btnIn 0.5s ease forwards;
      position: relative;
      overflow: hidden;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .btn:nth-child(1) { animation-delay: 0.3s; }
    .btn:nth-child(2) { animation-delay: 0.45s; }
    .btn:nth-child(3) { animation-delay: 0.6s; }
    .btn:nth-child(4) { animation-delay: 0.75s; }
    .btn:nth-child(5) { animation-delay: 0.9s; }
    .btn:nth-child(6) { animation-delay: 1.05s; }

    @keyframes btnIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(102, 126, 234, 0.5);
    }

    .btn:active {
      transform: translateY(0) scale(0.97);
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      right: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transition: right 0.6s;
      pointer-events: none;
    }

    .btn:hover::before { right: 100%; }

    /* 👇 استایل جدید برای آیکون‌ها */
    .btn .btn-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      color: #fff;
      border-radius: 50%;
      flex-shrink: 0;
      transition: transform 0.3s;
      overflow: hidden;
    }

    .btn .btn-icon svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* 🎨 رنگ‌های اختصاصی هر برند */
    .icon-aparat { background-color: #ED145B; }
    .icon-telegram { background-color: #0088cc; }
    .icon-instagram { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
    .icon-discord { background-color: #5865F2; }
    .icon-rubika { background-color: #714add; }
    
    /* 🎨 آیکون سیب‌مو دقیقاً طبق عکس ارسالی (مربع گرد سفید با S بنفش) */
    .icon-sibmo { 
      background-color: #FFFFFF !important; /* پس‌زمینه سفید */
      border-radius: 6px !important; /* گوشه‌های گرد مثل عکس */
      color: #6C5B7B !important; /* رنگ 'S' بنفش/خاکستری */
      font-family: Arial, sans-serif !important;
      font-weight: 900 !important;
      font-size: 18px !important;
      line-height: 1 !important;
    }
    
    .icon-about { background-color: var(--primary); }

    .btn:hover .btn-icon {
      transform: scale(1.1) rotate(-10deg);
    }

    /* ===== خط جداکننده ===== */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 18px 0;
      width: 100%;
      opacity: 0.6;
      border-radius: 2px;
    }

    /* ===== بخش درباره من ===== */
    #aboutSection {
      display: flex;
      flex-direction: column;
      gap: 15px;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .about-text {
      color: var(--text);
      font-size: 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 2.4;
      text-align: right;
      min-height: 150px;
      direction: rtl;
      font-weight: 500;
      letter-spacing: 0.5px;
      padding: 0 5px;
    }

    .about-text p {
      margin-bottom: 12px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .back-btn {
      align-self: flex-start;
      padding: 8px 16px;
      font-size: 13px;
      border-radius: 15px;
      background: rgba(102, 126, 234, 0.15);
      color: var(--primary);
      border: 1px solid var(--border);
    }

    .back-btn:hover {
      background: var(--primary);
      color: #fff;
      transform: translateY(-2px);
    }

    /* ===== پخش‌کننده موزیک ===== */
    .music-player {
      background: var(--player-bg);
      border: 1px solid var(--clock-border);
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      animation: fadeUp 0.6s ease 1s both;
      transition: opacity 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .play-btn {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.2s;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .play-btn:hover { transform: scale(1.08); }
    .play-btn:active { transform: scale(0.95); }

    .play-btn::before {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--primary);
      border-right-color: var(--primary);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .music-player.playing .play-btn::before {
      opacity: 1;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .player-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 0;
    }

    .player-title {
      font-size: 12px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-title .note {
      display: inline-block;
      transition: transform 0.3s;
    }

    .music-player.playing .player-title .note {
      animation: bounce 0.6s ease-in-out infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    .progress-bar {
      width: 100%;
      height: 5px;
      background: rgba(102, 126, 234, 0.2);
      border-radius: 10px;
      cursor: pointer;
      overflow: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), var(--primary-dark));
      border-radius: 10px;
      transition: width 0.1s linear;
      will-change: width;
    }

    .player-time {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: var(--muted);
      font-family: Arial, sans-serif;
      direction: ltr;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .volume-btn {
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .volume-btn:hover { transform: scale(1.15); }

    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 50px;
      height: 4px;
      background: rgba(102, 126, 234, 0.25);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      touch-action: manipulation;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);
      transition: transform 0.2s;
    }

    .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--primary);
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 6px rgba(102, 126, 234, 0.5);
    }

    /* ===== کلاس مخفی ===== */
    .hidden { display: none !important; }

    /* ===== فوتر ===== */
    .footer {
      margin-top: 15px;
      font-size: 12px;
      color: var(--muted);
      opacity: 0.7;
    }

    /* ===== کانفتی ===== */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      z-index: 9998;
      pointer-events: none;
      border-radius: 2px;
      will-change: transform, opacity;
    }

    /* ===== ریسپانسیو ===== */
    @media (max-width: 400px) {
      .card { padding: 25px 18px 20px; border-radius: 18px; }
      .avatar { width: 90px; height: 90px; font-size: 50px; margin-top: 30px; }
      .card h2 { font-size: 22px; }
      .btn { font-size: 14px; padding: 12px 16px; }
      .clock-box { padding: 5px 9px; border-radius: 12px; }
      .clock-time { font-size: 12px; }
      .clock-date { font-size: 9px; }
      .theme-btn { width: 34px; height: 34px; font-size: 15px; }
      .volume-slider { width: 40px; }
      .play-btn { width: 40px; height: 40px; font-size: 14px; }
    }

    @media (max-width: 768px) {
      body { animation-duration: 20s; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="particles"></canvas>

  <div class="card">
    <button class="theme-btn" id="themeBtn" title="تغییر تم" aria-label="تغییر تم">🌙</button>

    <div class="clock-box">
      <div class="clock-time" id="clockTime">
        <span id="h">00</span><span class="sep">:</span><span id="m">00</span><span class="sep">:</span><span id="s">00</span>
      </div>
      <div class="clock-date" id="clockDate">—</div>
    </div>

    <div class="avatar">🍍</div>
    <h2>NIXI</h2>
    <p id="typingText"></p>

    <div class="music-player" id="musicPlayer">
      <button class="play-btn" id="playBtn" aria-label="پخش / توقف">▶</button>
      <div class="player-info">
        <div class="player-title">
          <span class="note">🎵</span>
          <span><i>MOWZ ANANASI</i></span>
        </div>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="player-time">
          <span id="currentTime">0:00</span>
          <span id="duration">0:00</span>
        </div>
      </div>
      <div class="volume-control">
        <button class="volume-btn" id="volumeBtn" aria-label="صدا">🔊</button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="0.7" />
      </div>
    </div>

    <!-- ===== دکمه‌ها ===== -->
    <div class="buttons" id="mainButtons">
      <!-- Aparat -->
      <a title="Nixi" href="https://www.aparat.com/hysnixi/live" class="btn" target="_blank" rel="noopener">
        <span class="btn-icon icon-aparat">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 14H3V8h18v12zM9 10v8l7-4-7-4z"/></svg>
        </span>
        <b>Aparat</b>
      </a>
      <!-- Telegram -->
      <a href="https://t.me/HysNixi" class="btn" target="_blank" rel="noopener">
        <span class="btn-icon icon-telegram">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l15.97-6.16c.73-.27 1.37.18 1.14 1.31l-2.72 12.81c-.22.99-.83 1.24-1.67.76l-4.46-3.28-2.16 2.09c-.26.26-.47.47-.94.47z"/></svg>
        </span>
        <b>Telegram</b>
      </a>
      <!-- Instagram -->

        <span class="btn-icon icon-instagram">

  <audio id="bgMusic" loop preload="metadata">

  <script>
    /* ========== ۱. تغییر تم ========== */
    const themeBtn = document.getElementById("themeBtn");
    const body = document.body;
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
      body.classList.add("dark");
      themeBtn.textContent = "☀️";
    }

    themeBtn.addEventListener("click", () => {
      body.classList.toggle("dark");
      const isDark = body.classList.contains("dark");
      themeBtn.textContent = isDark ? "☀️" : "🌙";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    /* ========== ۲. ساعت و تاریخ ========== */
    const hEl = document.getElementById("h");
    const mEl = document.getElementById("m");
    const sEl = document.getElementById("s");
    const dateEl = document.getElementById("clockDate");

    function updateClock() {
      const now = new Date();
      const h = now.getHours().toString().padStart(2, "0");
      const m = now.getMinutes().toString().padStart(2, "0");
      const s = now.getSeconds().toString().padStart(2, "0");

      hEl.textContent = h;
      mEl.textContent = m;
      sEl.textContent = s;

      const dateStr = now.toLocaleDateString("en-US", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric",
      });
      dateEl.textContent = dateStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ========== ۳. افکت تایپ ========== */
    const typingEl = document.getElementById("typingText");
    const messages = [
      "هیسسس🤫نیکسی",
      "خوش اومدی به صفحه من 🌟",
      "برای اطلاع از ساعت استریم عضو چنل ها شید👇🏼",
    ];
    let msgIndex = 0,
      charIndex = 0,
      deleting = false;

    function type() {
      const current = messages[msgIndex];

      if (!deleting) {
        typingEl.textContent = current.substring(0, charIndex + 1);
        charIndex++;
        if (charIndex === current.length) {
          deleting = true;
          setTimeout(type, 1800);
          return;
        }
      } else {
        typingEl.textContent = current.substring(0, charIndex - 1);
        charIndex--;
        if (charIndex === 0) {
          deleting = false;
          msgIndex = (msgIndex + 1) % messages.length;
        }
      }
      setTimeout(type, deleting ? 50 : 100);
    }
    type();

    /* ========== ۴. کانفتی ========== */
    const colors = [
      "#667eea", "#764ba2", "#ff6b6b", "#feca57", "#48dbfb", "#1dd1a1",
    ];

    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    const confettiCount = isMobile ? 18 : 30;

    function createConfetti(x, y) {
      for (let i = 0; i < confettiCount; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.left = x + "px";
        c.style.top = y + "px";
        c.style.transform = `translate3d(0,0,0) rotate(${Math.random() * 360}deg)`;
        document.body.appendChild(c);

        const angle = Math.random() * Math.PI * 2;
        const velocity = 4 + Math.random() * 6;
        let posX = x, posY = y;
        let velX = Math.cos(angle) * velocity;
        let velY = Math.sin(angle) * velocity - 4;
        let rotation = Math.random() * 360;
        let life = 100;

        const interval = setInterval(() => {
          posX += velX;
          posY += velY;
          velY += 0.35;
          velX *= 0.99;
          rotation += 6;
          life--;

          c.style.left = posX + "px";
          c.style.top = posY + "px";
          c.style.transform = `rotate(${rotation}deg)`;
          c.style.opacity = life / 100;

          if (life <= 0 || posY > window.innerHeight) {
            clearInterval(interval);
            c.remove();
          }
        }, 16);
      }
    }

    document.querySelectorAll(".btn").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        createConfetti(e.clientX, e.clientY);
      });
    });

    /* ========== ۵. پخش‌کننده موزیک ========== */
    const audio = document.getElementById("bgMusic");
    const playBtn = document.getElementById("playBtn");
    const musicPlayer = document.getElementById("musicPlayer");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const volumeBtn = document.getElementById("volumeBtn");
    const volumeSlider = document.getElementById("volumeSlider");

    audio.volume = 0.7;
    audio.preload = "metadata";

    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60).toString().padStart(2, "0");
      return `${m}:${s}`;
    }

    playBtn.addEventListener("click", () => {
      if (audio.paused) { audio.play(); } else { audio.pause(); }
    });

    audio.addEventListener("play", () => {
      playBtn.textContent = "❚❚";
      musicPlayer.classList.add("playing");
    });

    audio.addEventListener("pause", () => {
      playBtn.textContent = "▶";
      musicPlayer.classList.remove("playing");
    });

    audio.addEventListener("timeupdate", () => {
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = percent + "%";
      currentTimeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener("loadedmetadata", () => {
      durationEl.textContent = formatTime(audio.duration);
    });

    progressBar.addEventListener("click", (e) => {
      const rect = progressBar.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      audio.currentTime = percent * audio.duration;
    });

    volumeSlider.addEventListener("input", () => {
      audio.volume = volumeSlider.value;
      updateVolumeIcon();
    });

    volumeBtn.addEventListener("click", () => {
      if (audio.volume > 0) {
        audio.dataset.prevVolume = audio.volume;
        audio.volume = 0;
        volumeSlider.value = 0;
      } else {
        audio.volume = audio.dataset.prevVolume || 0.7;
        volumeSlider.value = audio.volume;
      }
      updateVolumeIcon();
    });

    function updateVolumeIcon() {
      if (audio.volume === 0) { volumeBtn.textContent = "🔇"; }
      else if (audio.volume < 0.5) { volumeBtn.textContent = "🔉"; }
      else { volumeBtn.textContent = "🔊"; }
    }
    updateVolumeIcon();

    /* ========== ۶. بخش درباره من ========== */
    const aboutBtn = document.getElementById("aboutBtn");
    const aboutSection = document.getElementById("aboutSection");
    const aboutText = document.getElementById("aboutText");
    const backBtn = document.getElementById("backBtn");
    const mainButtons = document.getElementById("mainButtons");

    const aboutContent = `نيكسى هستم، اسم واقعيم

هانيه ست، 25 ساله 

از تير 1404سفرم توى دنياى استريم

رو شروع كردم و اينجا داريم

كم كم دنياى آناناسى

خودمون رو مى سازيم.

تاامروز بيشتر با بازى هاى داستانى،

انتخاب محور، ترسناك
و دوبعدى همراه بوديم؛

بازى هايى كه انتخاب هات

مى تونن همه چيز رو تغيير بدن...

درست مثل داستان هاى

خوب وتصميمات به موقع.

تازه وارد دنياى FPS شديم

و اين مسير قراره هميشه كنارمون باشه 

خيلى زود هم وارد دنياى souls like مى شيم:) و...`;

    function showAboutTextLineByLine(text, element) {
      element.innerHTML = "";
      const lines = text.split("\n").filter((line) => line.trim() !== "");

      lines.forEach((line, index) => {
        const p = document.createElement("p");
        p.textContent = line.trim();
        element.appendChild(p);

        setTimeout(() => {
          p.style.opacity = "1";
          p.style.transform = "translateY(0)";
        }, index * 250);
      });
    }

    aboutBtn.addEventListener("click", (e) => {
      e.preventDefault();
      mainButtons.classList.add("hidden");
      musicPlayer.classList.add("hidden");
      aboutSection.classList.remove("hidden");
      showAboutTextLineByLine(aboutContent, aboutText);
    });

    backBtn.addEventListener("click", () => {
      aboutSection.classList.add("hidden");
      mainButtons.classList.remove("hidden");
      musicPlayer.classList.remove("hidden");
    });

    /* ========== ۷. ذرات پس‌زمینه ========== */
    const canvas = document.getElementById("particles");
    const ctx = canvas.getContext("2d");
    let particles = [];
    const mouse = { x: null, y: null, radius: 120 };

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize, { passive: true });

    window.addEventListener("mousemove", (e) => { mouse.x = e.x; mouse.y = e.y; }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      if (e.touches.length > 0) { mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; }
    }, { passive: true });
    window.addEventListener("mouseout", () => { mouse.x = null; mouse.y = null; });

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2.5 + 1;
        this.speedX = (Math.random() - 0.5) * 0.6;
        this.speedY = (Math.random() - 0.5) * 0.6;
        this.opacity = Math.random() * 0.5 + 0.3;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

        if (mouse.x != null && mouse.y != null) {
          const dx = mouse.x - this.x;
          const dy = mouse.y - this.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < mouse.radius) {
            const force = (mouse.radius - dist) / mouse.radius;
            this.x -= (dx / dist) * force * 2;
            this.y -= (dy / dist) * force * 2;
          }
        }
      }

      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particles = [];
      const maxParticles = isMobile ? 40 : 80;
      const count = Math.min(maxParticles, Math.floor((canvas.width * canvas.height) / 18000));
      for (let i = 0; i < count; i++) {
        particles.push(new Particle());
      }
    }
    initParticles();
    window.addEventListener("resize", initParticles, { passive: true });

    function connectParticles() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 120) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 * (1 - dist / 120)})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        p.update();
        p.draw();
      });
      connectParticles();
      requestAnimationFrame(animate);
    }
    animate();

    console.log("✅ سایت HYS NIXI با موفقیت بارگذاری شد");
  </script>
